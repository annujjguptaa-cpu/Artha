<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artha Auto-Cart</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --teal: #00A896;
      --mint: #22c55e;
      --amber: #f59e0b;
      --red: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      width: 320px;
      min-height: 420px;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
    }

    .header {
      display: flex;
      items-center: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }

    .title-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, var(--teal), var(--mint));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #022c22;
      font-size: 13px;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .status-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      background: rgba(0, 168, 150, 0.2);
      color: #4ade80;
      border: 1px solid rgba(0, 168, 150, 0.4);
    }

    .progress-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .progress-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .progress-bar-bg {
      width: 100%;
      height: 8px;
      background: #0f172a;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--teal), var(--mint));
      transition: width 0.3s ease;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    button {
      flex: 1;
      padding: 9px 12px;
      border-radius: 8px;
      border: none;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--teal), var(--mint));
      color: #022c22;
    }

    .btn-primary:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background: #334155;
      color: var(--text-muted);
    }

    .btn-secondary:hover {
      background: #475569;
      color: var(--text);
    }

    .logs-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .logs-container {
      max-height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .log-item {
      font-size: 11px;
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--card-bg);
      border-left: 3px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .log-item.success {
      border-left-color: var(--mint);
    }

    .log-item.info {
      border-left-color: var(--teal);
    }

    .log-item.warning {
      border-left-color: var(--amber);
    }

    .log-time {
      font-size: 9px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-group">
      <div class="logo-badge">A</div>
      <div class="title">Artha Auto-Cart</div>
    </div>
    <div class="status-pill" id="status-pill">Active</div>
  </div>

  <div class="progress-card">
    <div class="progress-header">
      <span id="status-text">Ready for cart execution</span>
      <span id="count-text">0/0</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progress-fill"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="btn-test">Test Auto-Cart</button>
    <button class="btn-secondary" id="btn-clear">Clear Logs</button>
  </div>

  <div class="logs-title">Execution Log</div>
  <div class="logs-container" id="logs-container">
    <div class="log-item info">
      <span>Extension connected</span>
      <span class="log-time">Now</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
